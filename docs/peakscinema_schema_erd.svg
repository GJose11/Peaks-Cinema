<svg xmlns="http://www.w3.org/2000/svg" width="3800" height="2400" viewBox="0 0 3800 2400">
  <defs>
    <style>
      .bg { fill: #fff; }
      .table { fill: #fff; stroke: #000; stroke-width: 2.5; }
      .head { fill: #efefef; stroke: #000; stroke-width: 2.5; }
      .title { font: 700 42px "Times New Roman", serif; fill: #000; }
      .tname { font: 700 24px "Times New Roman", serif; fill: #000; }
      .row { font: 18px "Times New Roman", serif; fill: #000; }
      .line { stroke: #000; stroke-width: 3; fill: none; }
      .card { font: 700 20px "Times New Roman", serif; fill: #000; }
      .note { font: 18px "Times New Roman", serif; fill: #000; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="3800" height="2400"/>
  <text x="1900" y="60" text-anchor="middle" class="title">PeaksCinema Online Movie Ticketing System Schema ERD</text>
  <text x="1900" y="95" text-anchor="middle" class="note">Detailed database-oriented view of the current system</text>

  <!-- left column -->
  <g transform="translate(80,180)">
    <rect class="table" width="360" height="180"/><rect class="head" width="360" height="44"/>
    <text x="180" y="28" text-anchor="middle" class="tname">mall</text>
    <text x="16" y="72" class="row">PK Mall_ID</text><text x="16" y="100" class="row">MallName</text><text x="16" y="128" class="row">Location</text><text x="16" y="156" class="row">Latitude / Longitude</text>
  </g>
  <g transform="translate(80,430)">
    <rect class="table" width="360" height="200"/><rect class="head" width="360" height="44"/>
    <text x="180" y="28" text-anchor="middle" class="tname">theater</text>
    <text x="16" y="72" class="row">PK Theater_ID</text><text x="16" y="100" class="row">FK Mall_ID</text><text x="16" y="128" class="row">TheaterName</text><text x="16" y="156" class="row">TheaterType</text><text x="16" y="184" class="row">TotalSeats</text>
  </g>
  <g transform="translate(80,700)">
    <rect class="table" width="360" height="220"/><rect class="head" width="360" height="44"/>
    <text x="180" y="28" text-anchor="middle" class="tname">seats</text>
    <text x="16" y="72" class="row">PK Seat_ID</text><text x="16" y="100" class="row">FK Theater_ID</text><text x="16" y="128" class="row">FK TimeSlot_ID</text><text x="16" y="156" class="row">SeatRow</text><text x="16" y="184" class="row">SeatColumn</text><text x="16" y="212" class="row">SeatType / Availability</text>
  </g>
  <g transform="translate(80,990)">
    <rect class="table" width="360" height="190"/><rect class="head" width="360" height="44"/>
    <text x="180" y="28" text-anchor="middle" class="tname">cinema_queue</text>
    <text x="16" y="72" class="row">PK Queue_ID</text><text x="16" y="100" class="row">FK Mall_ID</text><text x="16" y="128" class="row">Area</text><text x="16" y="156" class="row">QueueLength</text><text x="16" y="184" class="row">CurrentWaitMins</text>
  </g>

  <!-- middle -->
  <g transform="translate(700,180)">
    <rect class="table" width="380" height="220"/><rect class="head" width="380" height="44"/>
    <text x="190" y="28" text-anchor="middle" class="tname">movie</text>
    <text x="16" y="72" class="row">PK Movie_ID</text><text x="16" y="100" class="row">MovieName</text><text x="16" y="128" class="row">Genre</text><text x="16" y="156" class="row">Rating / Runtime</text><text x="16" y="184" class="row">Price / Availability</text><text x="16" y="212" class="row">TrailerURL / MoviePoster</text>
  </g>
  <g transform="translate(700,470)">
    <rect class="table" width="380" height="220"/><rect class="head" width="380" height="44"/>
    <text x="190" y="28" text-anchor="middle" class="tname">timeslot</text>
    <text x="16" y="72" class="row">PK TimeSlot_ID</text><text x="16" y="100" class="row">FK Movie_ID</text><text x="16" y="128" class="row">FK Theater_ID</text><text x="16" y="156" class="row">Date</text><text x="16" y="184" class="row">StartTime</text><text x="16" y="212" class="row">ScreeningType</text>
  </g>
  <g transform="translate(700,760)">
    <rect class="table" width="380" height="230"/><rect class="head" width="380" height="44"/>
    <text x="190" y="28" text-anchor="middle" class="tname">ticket</text>
    <text x="16" y="72" class="row">PK Ticket_ID</text><text x="16" y="100" class="row">FK Customer_ID</text><text x="16" y="128" class="row">FK Movie_ID</text><text x="16" y="156" class="row">FK TimeSlot_ID</text><text x="16" y="184" class="row">BookingRef / DateTime</text><text x="16" y="212" class="row">Price / Status / CancelledAt</text>
  </g>
  <g transform="translate(700,1060)">
    <rect class="table" width="380" height="190"/><rect class="head" width="380" height="44"/>
    <text x="190" y="28" text-anchor="middle" class="tname">payment</text>
    <text x="16" y="72" class="row">PK Payment_ID</text><text x="16" y="100" class="row">FK Ticket_ID</text><text x="16" y="128" class="row">AmountPaid</text><text x="16" y="156" class="row">PaymentMethod</text><text x="16" y="184" class="row">PaymentStatus</text>
  </g>
  <g transform="translate(700,1320)">
    <rect class="table" width="380" height="190"/><rect class="head" width="380" height="44"/>
    <text x="190" y="28" text-anchor="middle" class="tname">e-receipt</text>
    <text x="16" y="72" class="row">PK Receipt_ID</text><text x="16" y="100" class="row">FK Payment_ID</text><text x="16" y="128" class="row">DateIssued</text><text x="16" y="156" class="row">SentEmail</text><text x="16" y="184" class="row">ReceiptStatus</text>
  </g>

  <!-- right -->
  <g transform="translate(1360,520)">
    <rect class="table" width="360" height="220"/><rect class="head" width="360" height="44"/>
    <text x="180" y="28" text-anchor="middle" class="tname">customer</text>
    <text x="16" y="72" class="row">PK Customer_ID</text><text x="16" y="100" class="row">Name</text><text x="16" y="128" class="row">Email</text><text x="16" y="156" class="row">PhoneNumber</text><text x="16" y="184" class="row">ProfilePhoto</text><text x="16" y="212" class="row">PaymentMethod</text>
  </g>
  <g transform="translate(1360,820)">
    <rect class="table" width="360" height="170"/><rect class="head" width="360" height="44"/>
    <text x="180" y="28" text-anchor="middle" class="tname">otp</text>
    <text x="16" y="72" class="row">PK OTP_ID</text><text x="16" y="100" class="row">FK Customer_ID</text><text x="16" y="128" class="row">otp_code</text><text x="16" y="156" class="row">expires_at</text>
  </g>
  <g transform="translate(1360,1060)">
    <rect class="table" width="360" height="190"/><rect class="head" width="360" height="44"/>
    <text x="180" y="28" text-anchor="middle" class="tname">notifications</text>
    <text x="16" y="72" class="row">PK Notif_ID</text><text x="16" y="100" class="row">FK Customer_ID</text><text x="16" y="128" class="row">Title</text><text x="16" y="156" class="row">Message</text><text x="16" y="184" class="row">CreatedAt / IsRead</text>
  </g>
  <g transform="translate(1360,1320)">
    <rect class="table" width="360" height="210"/><rect class="head" width="360" height="44"/>
    <text x="180" y="28" text-anchor="middle" class="tname">discount_verifications</text>
    <text x="16" y="72" class="row">PK Verify_ID</text><text x="16" y="100" class="row">FK Ticket_ID</text><text x="16" y="128" class="row">FK Customer_ID</text><text x="16" y="156" class="row">DiscountType / Status</text><text x="16" y="184" class="row">DiscountAmount</text><text x="16" y="212" class="row">ReviewEmail</text>
  </g>
  <g transform="translate(1360,1600)">
    <rect class="table" width="360" height="160"/><rect class="head" width="360" height="44"/>
    <text x="180" y="28" text-anchor="middle" class="tname">reminders_sent</text>
    <text x="16" y="72" class="row">PK Reminder_ID</text><text x="16" y="100" class="row">FK Ticket_ID</text><text x="16" y="128" class="row">SentAt</text>
  </g>

  <!-- far right -->
  <g transform="translate(2020,180)">
    <rect class="table" width="340" height="150"/><rect class="head" width="340" height="44"/>
    <text x="170" y="28" text-anchor="middle" class="tname">admin</text>
    <text x="16" y="72" class="row">PK Admin_ID</text><text x="16" y="100" class="row">Username</text><text x="16" y="128" class="row">Password / Role</text>
  </g>
  <g transform="translate(2020,390)">
    <rect class="table" width="340" height="170"/><rect class="head" width="340" height="44"/>
    <text x="170" y="28" text-anchor="middle" class="tname">staff</text>
    <text x="16" y="72" class="row">PK Staff_ID</text><text x="16" y="100" class="row">Name</text><text x="16" y="128" class="row">Email</text><text x="16" y="156" class="row">Password</text>
  </g>
  <g transform="translate(2520,260)">
    <rect class="table" width="380" height="220"/><rect class="head" width="380" height="44"/>
    <text x="190" y="28" text-anchor="middle" class="tname">food_items</text>
    <text x="16" y="72" class="row">PK Item_ID</text><text x="16" y="100" class="row">ItemName</text><text x="16" y="128" class="row">Description</text><text x="16" y="156" class="row">Price / Category</text><text x="16" y="184" class="row">IsAvailable / SortOrder</text><text x="16" y="212" class="row">Created_At</text>
  </g>
  <g transform="translate(2520,590)">
    <rect class="table" width="380" height="230"/><rect class="head" width="380" height="44"/>
    <text x="190" y="28" text-anchor="middle" class="tname">food_orders</text>
    <text x="16" y="72" class="row">PK Order_ID</text><text x="16" y="100" class="row">FK Customer_ID</text><text x="16" y="128" class="row">FK TimeSlot_ID</text><text x="16" y="156" class="row">FK Item_ID</text><text x="16" y="184" class="row">Quantity / UnitPrice</text><text x="16" y="212" class="row">BookingRef / Created_At</text>
  </g>

  <!-- connectors -->
  <path class="line" d="M440 280 H700"/><text x="560" y="260" class="card">1:N</text>
  <path class="line" d="M440 530 H700"/><text x="560" y="510" class="card">1:N</text>
  <path class="line" d="M260 360 V430"/><text x="280" y="405" class="card">1:N</text>
  <path class="line" d="M260 630 V700"/><text x="280" y="675" class="card">1:N</text>
  <path class="line" d="M260 360 V990"/><text x="280" y="820" class="card">1:N</text>
  <path class="line" d="M890 400 V470"/><text x="910" y="445" class="card">1:N</text>
  <path class="line" d="M1080 580 H1360"/><text x="1200" y="560" class="card">1:N</text>
  <path class="line" d="M1080 820 H1360"/><text x="1200" y="800" class="card">1:N</text>
  <path class="line" d="M1080 875 V875 H1360"/><text x="1210" y="855" class="card">1:N</text>
  <path class="line" d="M890 990 V1060"/><text x="910" y="1035" class="card">1:N</text>
  <path class="line" d="M890 1250 V1320"/><text x="910" y="1295" class="card">1:N</text>
  <path class="line" d="M1540 740 V820"/><text x="1560" y="785" class="card">1:N</text>
  <path class="line" d="M1540 740 V1060"/><text x="1560" y="930" class="card">1:N</text>
  <path class="line" d="M1540 740 V1320"/><text x="1560" y="1210" class="card">1:N</text>
  <path class="line" d="M890 875 C1180 875,1180 1700,1360 1700"/><text x="1180" y="1450" class="card">1:N</text>
  <path class="line" d="M1720 630 H2520"/><text x="2100" y="610" class="card">1:N</text>
  <path class="line" d="M2900 370 V590"/><text x="2920" y="500" class="card">1:N</text>
  <path class="line" d="M1720 630 C2100 630,2100 705,2520 705"/><text x="2100" y="685" class="card">1:N</text>

  <text x="1900" y="2310" text-anchor="middle" class="note">Schema ERD includes the primary tables and their key attributes used in the PeaksCinema database design.</text>
</svg>
