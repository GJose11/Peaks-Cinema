<svg xmlns="http://www.w3.org/2000/svg" width="3600" height="2200" viewBox="0 0 3600 2200">
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .table { fill: #ffffff; stroke: #5b6f95; stroke-width: 2.2; }
      .head { fill: #dbe8ff; stroke: #5b6f95; stroke-width: 2.2; }
      .title { font: 700 42px Arial, sans-serif; fill: #1f2d3d; }
      .tname { font: 700 24px Arial, sans-serif; fill: #1f2d3d; }
      .row { font: 18px Arial, sans-serif; fill: #223; }
      .note { font: 18px Arial, sans-serif; fill: #4c5b70; }
      .line { stroke: #6e7fa6; stroke-width: 3; fill: none; }
      .crow { font: 22px Arial, sans-serif; fill: #4f628e; }
      .rel { stroke: #6e7fa6; stroke-width: 3; fill: none; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="3600" height="2200"/>
  <text x="1800" y="60" text-anchor="middle" class="title">PeaksCinema Online Movie Ticketing System ERD</text>
  <text x="1800" y="95" text-anchor="middle" class="note">Lucidchart-style schema view based on the current PeaksCinema database tables and observed PHP module usage</text>

  <!-- CUSTOMER -->
  <g transform="translate(80,180)">
    <rect class="table" width="360" height="220" rx="8"/>
    <rect class="head" width="360" height="46" rx="8"/>
    <text x="180" y="30" text-anchor="middle" class="tname">customer</text>
    <text x="18" y="76" class="row">PK  Customer_ID</text>
    <text x="18" y="106" class="row">Name</text>
    <text x="18" y="136" class="row">Email</text>
    <text x="18" y="166" class="row">Password</text>
    <text x="18" y="196" class="row">ProfilePhoto</text>
  </g>

  <!-- ADMIN -->
