<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1700" viewBox="0 0 3200 1700">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .entity { fill: #f7f9fc; stroke: #3e5f8a; stroke-width: 3; rx: 14; }
      .title { font: 700 42px "Times New Roman", serif; fill: #000; }
      .name { font: 700 28px "Times New Roman", serif; fill: #000; text-anchor: middle; dominant-baseline: middle; }
      .line { stroke: #000; stroke-width: 3.2; fill: none; }
      .card { font: 700 22px "Times New Roman", serif; fill: #000; }
      .note { font: 20px "Times New Roman", serif; fill: #000; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="3200" height="1700"/>
  <text x="1600" y="70" text-anchor="middle" class="title">PeaksCinema Online Movie Ticketing System Simple ERD</text>
  <text x="1600" y="105" text-anchor="middle" class="note">Major entities and relationships only</text>

  <rect class="entity" x="120" y="180" width="260" height="90"/>
  <text x="250" y="225" class="name">Mall</text>

  <rect class="entity" x="520" y="180" width="260" height="90"/>
  <text x="650" y="225" class="name">Movie</text>

  <rect class="entity" x="920" y="180" width="260" height="90"/>
  <text x="1050" y="225" class="name">Theater</text>

  <rect class="entity" x="1320" y="180" width="260" height="90"/>
