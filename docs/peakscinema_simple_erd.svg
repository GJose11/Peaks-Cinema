  <rect class="entity" x="920" y="460" width="260" height="90"/>
  <text x="1050" y="505" class="name">Food Items</text>

  <path class="line" d="M380 225 H520"/>
  <text x="440" y="210" class="card">1:N</text>

  <path class="line" d="M780 225 H920"/>
  <text x="840" y="210" class="card">1:N</text>

  <path class="line" d="M1180 225 H1320"/>
  <text x="1240" y="210" class="card">1:N</text>

  <path class="line" d="M1580 225 H1720"/>
  <text x="1640" y="210" class="card">1:N</text>

  <path class="line" d="M2380 225 H2520"/>
  <text x="2440" y="210" class="card">1:N</text>

  <path class="line" d="M1450 270 V360 H2650 V460"/>
  <text x="2050" y="345" class="card">1:N</text>

  <path class="line" d="M2250 270 V460"/>
  <text x="2270" y="365" class="card">1:N</text>

  <path class="line" d="M2650 270 V460"/>
  <text x="2670" y="365" class="card">1:N</text>

